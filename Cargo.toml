[package]
name = "process-tab-manager"
version = "2.0.0"
edition = "2021"
description = "Vertical sidebar for managing application windows on Linux/X11"
license = "MIT"

[[bin]]
name = "ptm"
path = "src/main.rs"

[dependencies]
x11rb = { version = "0.13", features = ["extra-traits"] }
# SIGUSR1 signal handling for the Phase 5a recipe-dump trigger. Tiny,
# ubiquitous, no transitive risk. Only used by the signal thread; the
# rest of the code is libc-free.
libc = "0.2"

[dev-dependencies]
# Used in tests/symlink-resolution integration tests for
# terminal_argv_for_attach. Dev-only — no runtime dep impact.
tempfile = "3"
